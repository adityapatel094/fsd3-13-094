<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Apex Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="courses.html" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-cyan-500/30">A</div>
                    <span class="text-2xl font-bold bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">Apex Academy</span>
                </a>
                <div class="hidden md:flex items-center gap-1 bg-slate-800/60 p-1.5 rounded-full border border-slate-700/50">
                    <a href="courses.html" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">Courses</a>
                    <a href="price.html" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">Pricing</a>
                    <a href="register.html" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">Register</a>
                    <a href="login.html" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all bg-cyan-500 text-white shadow-md shadow-cyan-500/20">Login</a>
                    <a href="feedback.html" class="px-5 py-2.5 rounded-full text-sm font-medium transition-all text-slate-300 hover:text-white hover:bg-slate-800">Feedback</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-md mx-auto px-4 sm:px-6 py-16 w-full flex items-center justify-center">
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-3xl p-8 sm:p-10 shadow-2xl w-full">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 text-xl mx-auto mb-3">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-white mb-2">Welcome Back</h1>
                <p class="text-slate-400 text-sm">Access your student portal & tuition schedules.</p>
            </div>

            <form onsubmit="event.preventDefault(); alert('Login successful!');" class="space-y-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                        <input type="email" required placeholder="student@apex.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-sm">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-cyan-400 hover:underline">Forgot?</a>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                        <input type="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-sm">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 text-slate-400">
                        <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-0">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="w-full py-3.5 bg-cyan-500 hover:bg-cyan-400 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/20 transition">
                    Sign In to Portal
                </button>
            </form>

            <div class="mt-8 text-center text-xs text-slate-400 border-t border-slate-700/50 pt-6">
                Don't have an account yet? <a href="register.html" class="text-cyan-400 hover:underline font-semibold">Register for classes</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-500 flex items-center justify-center text-white font-bold text-sm">A</div>
                    <span class="text-lg font-bold text-white">Apex Academy</span>
                </div>
                <p class="text-slate-500 text-sm">© 2026 Apex Academy Tuition Classes. All rights reserved.</p>
                <div class="flex gap-4">
                    <a href="#" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:bg-slate-700 transition"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:bg-slate-700 transition"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:bg-slate-700 transition"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:bg-slate-700 transition"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-cyan-400 hover:bg-slate-700 transition"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
